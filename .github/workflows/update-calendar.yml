name: Update Forex Calendar

on:
  schedule:
    # Two triggers for redundancy — GitHub free tier delays scheduled jobs.
    # Off-peak UTC + odd minutes fire much more reliably.
    - cron: '17 0 * * *'   # 00:17 UTC = 07:17 AM Bangkok (primary)
    - cron: '37 3 * * *'   # 03:37 UTC = 10:37 AM Bangkok (backup)
  workflow_dispatch:        # also allows manual run from GitHub website

permissions:
  contents: write           # needed to commit & push data/docs back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gmail credentials
        run: |
          echo "${{ secrets.GMAIL_CREDENTIALS }}" | base64 -d > credentials.json
          echo "${{ secrets.GMAIL_TOKEN }}"       | base64 -d > token.json

      - name: Fetch today's email and update calendar
        run: python main.py --today

      - name: Commit if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/calendar.html docs/charts.html data/history_frozen.json
          if git diff --staged --quiet; then
            echo "No new email today — nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update calendar $(date +'%Y-%m-%d')"
          # Push with retry: if another run raced us, rebase on top and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push rejected on attempt $i — pulling and rebasing"
            git pull --rebase --autostash origin main || {
              echo "Rebase failed — aborting"
              git rebase --abort || true
              exit 1
            }
            # small backoff before next attempt
            sleep $((i * 2))
          done
          echo "Push failed after 5 attempts"
          exit 1
