name: Update Forex Calendar

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 AM Bangkok time, every day
  workflow_dispatch:        # also allows manual run from GitHub website

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gmail credentials
        run: |
          echo "${{ secrets.GMAIL_CREDENTIALS }}" | base64 -d > credentials.json
          echo "${{ secrets.GMAIL_TOKEN }}"       | base64 -d > token.json

      - name: Run calendar update
        run: python main.py --refresh

      - name: Copy calendar to docs/ (GitHub Pages)
        run: |
          mkdir -p docs
          cp output/calendar.html docs/index.html

      - name: Save updated token
        run: echo "$(base64 -w 0 token.json)" > /tmp/new_token.b64

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Auto-update calendar $(date +'%Y-%m-%d')"
          git push
