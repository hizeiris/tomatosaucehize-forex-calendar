name: Update Forex Calendar

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 AM Bangkok time, every day
  workflow_dispatch:        # also allows manual run from GitHub website

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Gmail credentials
        run: |
          echo "${{ secrets.GMAIL_CREDENTIALS }}" | base64 -d > credentials.json
          echo "${{ secrets.GMAIL_TOKEN }}"       | base64 -d > token.json

      - name: Fetch today's email and update calendar
        run: python main.py --today

      - name: Commit if updated
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.html docs/charts.html data/history_frozen.json
          git diff --staged --quiet \
            && echo "No new email today — nothing to commit." \
            || (git commit -m "Auto-update calendar $(date +'%Y-%m-%d')" && git push)
